<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Build-time steps from a markdown file to the chunk the browser downloads">
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff" fill-opacity="0.3"/>
    </marker>
  </defs>

  <rect width="1200" height="470" fill="#0b0b13"/>
  <rect width="1200" height="470" fill="url(#grid2)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <!-- build-time band -->
    <rect x="48" y="88" width="836" height="238" rx="20" fill="#2ff0d0" fill-opacity="0.035" stroke="#2ff0d0" stroke-opacity="0.2" stroke-dasharray="6 6"/>
    <text x="72" y="122" font-size="14" fill="#2ff0d0" letter-spacing="3">BUILD TIME · NODE</text>

    <!-- browser band -->
    <rect x="916" y="88" width="236" height="238" rx="20" fill="#b6ff2e" fill-opacity="0.035" stroke="#b6ff2e" stroke-opacity="0.2" stroke-dasharray="6 6"/>
    <text x="940" y="122" font-size="14" fill="#b6ff2e" letter-spacing="3">BROWSER</text>

    <g fill="#ecebe6">
      <g transform="translate(76 158)">
        <rect width="228" height="132" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
        <text x="22" y="42" font-size="17">note.md</text>
        <text x="22" y="72" font-size="13" fill-opacity="0.4">front matter</text>
        <text x="22" y="96" font-size="13" fill-opacity="0.4">markdown body</text>
      </g>

      <g transform="translate(348 158)">
        <rect width="228" height="132" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
        <text x="22" y="42" font-size="17">plugins/blog.ts</text>
        <text x="22" y="72" font-size="13" fill-opacity="0.4">parse · validate</text>
        <text x="22" y="96" font-size="13" fill-opacity="0.4">marked + shiki</text>
      </g>

      <g transform="translate(620 158)">
        <rect width="228" height="132" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
        <text x="22" y="42" font-size="17">note-a1b2.js</text>
        <text x="22" y="72" font-size="13" fill-opacity="0.4">meta · html · toc</text>
        <text x="22" y="96" font-size="13" fill-opacity="0.4">one chunk per post</text>
      </g>

      <g transform="translate(940 158)">
        <rect width="188" height="132" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#b6ff2e" stroke-opacity="0.3"/>
        <text x="22" y="42" font-size="17">/blog/note</text>
        <text x="22" y="72" font-size="13" fill-opacity="0.4">one fetch,</text>
        <text x="22" y="96" font-size="13" fill-opacity="0.4">on click</text>
      </g>
    </g>

    <path d="M318 224 H334" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <path d="M590 224 H606" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <path d="M862 224 H926" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <text x="48" y="392" font-size="14" fill="#ecebe6" fill-opacity="0.32">
      The markdown parser and the syntax highlighter never leave the build. The browser gets HTML.
    </text>
  </g>
</svg>
