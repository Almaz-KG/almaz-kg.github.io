<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 540" width="1260" height="540" role="img" aria-label="A markdown file compiled at build time into a page">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b13"/>
      <stop offset="1" stop-color="#101019"/>
    </linearGradient>
    <radialGradient id="glowLime" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b6ff2e" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#b6ff2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b7bff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8b7bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0v42" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff" fill-opacity="0.35"/>
    </marker>
  </defs>

  <rect width="1260" height="540" fill="url(#bg)"/>
  <rect width="1260" height="540" fill="url(#grid)"/>
  <ellipse cx="180" cy="120" rx="380" ry="300" fill="url(#glowLime)"/>
  <ellipse cx="1090" cy="470" rx="400" ry="320" fill="url(#glowViolet)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <!-- source -->
    <g transform="translate(96 186)">
      <rect width="278" height="168" rx="22" fill="#ffffff" fill-opacity="0.045" stroke="#b6ff2e" stroke-opacity="0.35"/>
      <text x="28" y="46" font-size="15" fill="#b6ff2e" letter-spacing="2.5">01 / SOURCE</text>
      <text x="28" y="92" font-size="21" fill="#ecebe6">content/posts/</text>
      <text x="28" y="122" font-size="21" fill="#ecebe6" fill-opacity="0.6">note.md</text>
      <text x="28" y="150" font-size="14" fill="#ecebe6" fill-opacity="0.35">markdown + front matter</text>
    </g>

    <!-- build -->
    <g transform="translate(491 186)">
      <rect width="278" height="168" rx="22" fill="#ffffff" fill-opacity="0.045" stroke="#2ff0d0" stroke-opacity="0.35"/>
      <text x="28" y="46" font-size="15" fill="#2ff0d0" letter-spacing="2.5">02 / BUILD</text>
      <text x="28" y="92" font-size="21" fill="#ecebe6">vite build</text>
      <text x="28" y="122" font-size="21" fill="#ecebe6" fill-opacity="0.6">marked · shiki</text>
      <text x="28" y="150" font-size="14" fill="#ecebe6" fill-opacity="0.35">runs once, in node</text>
    </g>

    <!-- output -->
    <g transform="translate(886 186)">
      <rect width="278" height="168" rx="22" fill="#ffffff" fill-opacity="0.045" stroke="#8b7bff" stroke-opacity="0.4"/>
      <text x="28" y="46" font-size="15" fill="#8b7bff" letter-spacing="2.5">03 / PAGE</text>
      <text x="28" y="92" font-size="21" fill="#ecebe6">/blog/note</text>
      <text x="28" y="122" font-size="21" fill="#ecebe6" fill-opacity="0.6">html + rss</text>
      <text x="28" y="150" font-size="14" fill="#ecebe6" fill-opacity="0.35">no parser shipped</text>
    </g>

    <path d="M392 270 H473" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M787 270 H868" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" marker-end="url(#arrow)"/>

    <text x="96" y="112" font-size="17" fill="#ecebe6" fill-opacity="0.45" letter-spacing="4">HOW THIS BLOG WORKS</text>
    <text x="96" y="452" font-size="15" fill="#ecebe6" fill-opacity="0.3">one directory of markdown, one plugin, no cms</text>
  </g>
</svg>
