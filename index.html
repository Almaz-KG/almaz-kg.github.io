<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fcfcfa" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- The faces the first screen of every page is set in. -->
    <link
      rel="preload"
      href="/assets/fonts/libertinus-serif-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/libertinus-serif-latin-600-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/inconsolata-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      Title, description, canonical, Open Graph and JSON-LD are per route, so
      the build writes them here for each pre-rendered page (scripts/prerender.ts)
      and useHead keeps them right after client-side navigation.
    -->
    <!--app-head-->
    <script>
      /*
       * Decides the theme before the first paint, so a reader who prefers dark
       * never sees the page flash light on its way in. Deliberately inline and
       * synchronous: a deferred module would run after the browser has already
       * painted the body background once.
       */
      (function () {
        var root = document.documentElement;
        var stored = null;
        try {
          stored = localStorage.getItem("theme");
        } catch (e) {
          /* private mode, or storage disabled */
        }

        var dark =
          stored === "dark" ||
          (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);

        root.dataset.theme = dark ? "dark" : "light";
        root.dataset.js = "";

        var chrome = document.querySelector('meta[name="theme-color"]');
        if (chrome && dark) chrome.setAttribute("content", "#141416");
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
