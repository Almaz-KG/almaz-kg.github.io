    <script>
      /*
       * Decides the surface and the theme before the first paint, so a light
       * post never flashes dark on its way in. Deliberately inline and
       * synchronous: a deferred module would run after the browser has already
       * painted the body background once.
       */
      (function () {
        var root = document.documentElement;
        var stored = null;
        try {
          stored = localStorage.getItem("theme");
        } catch (e) {
          /* private mode, or storage disabled */
        }

        var dark =
          stored === "dark" ||
          (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);

        root.dataset.theme = dark ? "dark" : "light";
        // Only the blog is themeable; the landing page is always dark.
        root.dataset.surface =
          location.pathname === "/blog" || location.pathname.indexOf("/blog/") === 0
            ? "reading"
            : "home";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
